<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor | Engineering Lab</title>
<meta name="description" content="An observability-style dashboard showing what production monitoring looks like for PesaGuard, using demo telemetry.">
<link rel="canonical" href="https://lab.victorkipruto.com/pages/monitor.html">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/monitor.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-nav="pages/monitor.html">
<div class="rail-scrim"></div>
<div class="shell">
  <aside class="rail" id="rail"></aside>

  <div>
    <div class="rail-toggle" id="rail-toggle"></div>

    <main>
      <div class="page-header">
        <span class="eyebrow">MONITOR</span>
        <h1>Observability</h1>
        <p>What production monitoring could look like for PesaGuard. Environment, source, and freshness are always labeled explicitly below.</p>
      </div>

      <div class="env-banner" id="env-banner">Loading environment info…</div>

      <div class="service-row" id="service-row"></div>

      <div class="metric-grid" id="metric-grid"></div>

      <div class="chart-panel">
        <div class="chart-head">
          <h3>Requests &amp; events per second</h3>
          <span class="chart-sub" id="rps-sub"></span>
        </div>
        <svg id="chart-rps" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      </div>

      <div class="chart-panel">
        <div class="chart-head">
          <h3>Latency (avg / P95, ms)</h3>
          <span class="chart-sub" id="latency-sub"></span>
        </div>
        <svg id="chart-latency" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      </div>
    </main>
  </div>
</div>

<script type="module" src="../js/app.js"></script>
<script type="module" src="../js/monitor.js"></script>
</body>
</html>
