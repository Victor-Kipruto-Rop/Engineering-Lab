name: Deploy Engineering Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON data files
        run: |
          for f in data/*.json; do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validate HTML (structural check)
        run: |
          for f in index.html pages/*.html; do
            echo "Checking $f"
            if ! grep -q "<!DOCTYPE html>" "$f"; then
              echo "::error file=$f::Missing DOCTYPE"
              exit 1
            fi
          done

      - name: Check for obvious secrets
        run: |
          if grep -rEi "(api[_-]?key|secret[_-]?key|password\s*=|BEGIN (RSA|EC) PRIVATE KEY)" \
              --include="*.html" --include="*.js" --include="*.json" --include="*.css" . ; then
            echo "::error::Potential secret detected in tracked files"
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
